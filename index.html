<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cẩm nang hóa giải sự trì hoãn | Bảo Việt Nhân thọ</title>
<meta name="description" content="Cẩm nang hóa giải sự trì hoãn của khách hàng — 4 nhóm: Không tin, Không tiền, Không vội, Không cần. Dành cho Tư vấn viên Bảo Việt Nhân thọ.">
<meta name="theme-color" content="#0b5fae">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a href="#/" class="brand" aria-label="Trang chủ">
    <img src="assets/logo-white.png" alt="Bảo Việt Nhân thọ" width="160" height="42">
  </a>
  <button class="icon-btn" id="qrBtn" aria-label="Mã QR chia sẻ trang này">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4M20 17v3"/></svg>
    <span>QR</span>
  </button>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <img src="assets/logo.png" alt="Bảo Việt Nhân thọ" width="150" height="45">
  <p>Tài liệu nội bộ dành cho Tư vấn viên · Cẩm nang hóa giải sự trì hoãn 2027</p>
</footer>

<div class="modal" id="qrModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <button class="modal-x" data-close aria-label="Đóng">×</button>
    <h2 id="qrTitle">Quét mã để mở trang này</h2>
    <div id="qrBox" class="qr-box"></div>
    <p class="qr-url" id="qrUrl"></p>
    <div class="modal-actions">
      <button class="btn" id="qrCopy">Sao chép link</button>
      <a class="btn btn-gold" id="qrDownload" download="cam-nang-qr.png">Tải mã QR</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/data.js"></script>
<script src="app.js"></script>
</body>
</html>
